  <!-- 解説フッター -->
  <rect x="20" y="434" width="940" height="92" class="callout-box" />
  <text x="38" y="457" class="ui" font-size="11.5" font-weight="700" fill="#92400E">① Start / Step ボタン（2行結合） ＋ ② 開始位置・現在位置（4列制御ブロック）</text>
  <text x="52" y="476" class="ui" font-size="11" fill="#451A03">・Start で一括連続測定、Step で 1 行ごとのデバッグ測定を実行。行挿入・行削除を行ってもボタンと番地判定は自動追従します。</text>
  <text x="38" y="497" class="ui" font-size="11.5" font-weight="700" fill="#92400E">③ 単体「実行」行（複数計測器混在対応） ＋ ④ Result 名前定義セル転記 ＋ ⑤ 公開パラメータ列（ドロップダウン・分岐先自動付与）</text>
  <text x="52" y="515" class="ui" font-size="11" fill="#451A03">・電源（E3631A_01）と DMM（HP_34401A）のコマンドを同一シートに並べ、測定結果を成績書セル（電圧測定値_CH1 等）へ直接転記できます。</text>

