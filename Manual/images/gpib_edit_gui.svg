<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="510" viewBox="0 0 940 510">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .tb-btn { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 3; }
      .lbl-3d { fill: #E2E8F0; stroke: #94A3B8; stroke-width: 1.2; }
      .cbo-box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.1; rx: 2; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
      .callout-title { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 12px; font-weight: 700; fill: #92400E; }
      .callout-txt { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; fill: #451A03; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="940" height="510" fill="#F8FAFC" rx="10" />

  <!-- GPIBコマンドパラメータ編集ウィンドウ (552 x 452, ControlBox=false のため右上×ボタンなし) -->
  <g transform="translate(24, 28)" filter="url(#winShadow)">
    <rect x="0" y="0" width="552" height="452" rx="6" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 0 6 Q 0 0 6 0 L 546 0 Q 552 0 552 6 L 552 30 L 0 30 Z" fill="url(#titleGrad)" />
    <text x="14" y="20" class="ui" font-size="13" font-weight="700" fill="#FFFFFF">GPIBコマンドパラメータ編集</text>
    <text x="410" y="20" class="ui" font-size="10.5" fill="#BFDBFE">※左端「終了」で閉じる設計</text>

    <!-- 上段バー (ツールバー6要素 + 右側コマンド選択コンボ txtNowCommand) -->
    <rect x="1" y="30" width="550" height="40" fill="url(#toolGrad)" stroke="#CBD5E1" stroke-width="1" />

    <!-- ① 左側ツールバー (6要素: 終了 | 新規 追加 | 実行 停止 表示切替[鍵]) -->
    <g transform="translate(10, 36)">
      <!-- 1. 終了 -->
      <rect x="0" y="0" width="28" height="28" class="tb-btn" />
      <rect x="6" y="6" width="11" height="16" fill="none" stroke="#475569" stroke-width="1.5" />
      <path d="M 13 14 L 22 14 M 19 11 L 22 14 L 19 17" stroke="#DC2626" stroke-width="1.5" fill="none" />
      <line x1="33" y1="3" x2="33" y2="25" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- 2. 新規保存 -->
      <rect x="38" y="0" width="28" height="28" class="tb-btn" />
      <rect x="45" y="5" width="14" height="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4" />
      <path d="M 52 9 L 52 17 M 48 13 L 56 13" stroke="#16A34A" stroke-width="1.6" />

      <!-- 3. 追加保存 (Append) -->
      <rect x="70" y="0" width="28" height="28" class="tb-btn" />
      <rect x="77" y="5" width="14" height="18" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4" />
      <line x1="80" y1="18" x2="88" y2="18" stroke="#D97706" stroke-width="1.8" />
      <line x1="103" y1="3" x2="103" y2="25" stroke="#CBD5E1" stroke-width="1.2" />

      <!-- 4. 実行 ▶ -->
      <rect x="108" y="0" width="28" height="28" class="tb-btn" />
      <polygon points="117,7 129,14 117,21" fill="#16A34A" />

      <!-- 5. 停止 ■ -->
      <rect x="140" y="0" width="28" height="28" class="tb-btn" />
      <rect x="149" y="9" width="10" height="10" fill="#DC2626" />

      <!-- 6. 表示切替 (ロック/アンロック鍵 VisibleCont) -->
      <rect x="172" y="0" width="28" height="28" class="tb-btn" />
      <rect x="180" y="13" width="12" height="10" rx="1.5" fill="#F59E0B" stroke="#B45309" stroke-width="1.2" />
      <path d="M 183 13 L 183 9 A 3 3 0 0 1 189 9 L 189 13" fill="none" stroke="#B45309" stroke-width="1.4" />
    </g>

    <!-- ② 右上コマンド選択コンボボックス (txtNowCommand) -->
    <rect x="256" y="37" width="282" height="26" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4" rx="3" />
    <text x="266" y="54" class="mono" font-size="12" font-weight="700" fill="#1E3A8A">HP_34401A_DCV</text>
    <rect x="516" y="38" width="21" height="24" fill="#DBEAFE" />
    <polygon points="522,48 531,48 526.5,54" fill="#1E40AF" />

    <!-- ③ 中段 GroupBox: パラメータ (5段スロット + 省略CheckBox + 右端スクロールバー) -->
    <rect x="14" y="84" width="524" height="182" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2" />
    <rect x="24" y="76" width="72" height="16" fill="#F3F4F6" />
    <text x="28" y="88" class="ui" font-size="12" font-weight="700" fill="#1E293B">パラメータ</text>

    <!-- スロット1 -->
    <g transform="translate(26, 100)">
      <rect x="0" y="0" width="154" height="24" class="lbl-3d" />
      <text x="8" y="16" class="ui" font-size="11.5" fill="#0F172A">測定レンジ</text>
      <rect x="182" y="0" width="276" height="24" class="cbo-box" />
      <text x="190" y="16" class="mono" font-size="11.5" fill="#0F172A">AUTO</text>
      <polygon points="444,10 452,10 448,15" fill="#475569" />
    </g>

    <!-- スロット2 -->
    <g transform="translate(26, 130)">
      <rect x="0" y="0" width="154" height="24" class="lbl-3d" />
      <text x="8" y="16" class="ui" font-size="11.5" fill="#0F172A">分解能</text>
      <rect x="182" y="0" width="276" height="24" class="cbo-box" />
      <text x="190" y="16" class="mono" font-size="11.5" fill="#0F172A">5.5桁 (DEF)</text>
      <polygon points="444,10 452,10 448,15" fill="#475569" />
    </g>

    <!-- スロット3 (省略可能 -List型) -->
    <g transform="translate(26, 160)">
      <rect x="0" y="0" width="154" height="24" class="lbl-3d" />
      <text x="8" y="16" class="ui" font-size="11.5" fill="#0F172A">NPLC積分時間</text>
      <rect x="161" y="5" width="14" height="14" rx="2" fill="#2563EB" />
      <path d="M 164 12 L 167 15 L 172 8" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
      <rect x="182" y="0" width="276" height="24" class="cbo-box" />
      <text x="190" y="16" class="mono" font-size="11.5" fill="#0F172A">10</text>
      <polygon points="444,10 452,10 448,15" fill="#475569" />
    </g>

    <!-- スロット4 -->
    <g transform="translate(26, 190)">
      <rect x="0" y="0" width="154" height="24" class="lbl-3d" />
      <text x="8" y="16" class="ui" font-size="11.5" fill="#0F172A">疑似データ(Debug)</text>
      <rect x="182" y="0" width="276" height="24" class="cbo-box" />
      <text x="190" y="16" class="mono" font-size="11.5" fill="#0F172A">+5.00124000E+00</text>
      <polygon points="444,10 452,10 448,15" fill="#475569" />
    </g>

    <!-- スロット5 -->
    <g transform="translate(26, 220)">
      <rect x="0" y="0" width="154" height="24" class="lbl-3d" />
      <text x="8" y="16" class="ui" font-size="11.5" fill="#475569">内部カウンタ(Work)</text>
      <rect x="182" y="0" width="276" height="24" class="cbo-box" />
      <text x="190" y="16" class="mono" font-size="11.5" fill="#475569">1</text>
      <polygon points="444,10 452,10 448,15" fill="#475569" />
    </g>

    <!-- ④ 右端パラメータ垂直スクロールバー (vsbParamScroll: 6個以上時に出現) -->
    <rect x="502" y="100" width="22" height="144" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    <polygon points="513,105 508,112 518,112" fill="#475569" />
    <rect x="504" y="120" width="18" height="48" rx="2" fill="#94A3B8" />
    <polygon points="513,239 508,232 518,232" fill="#475569" />

    <!-- ⑤ 下段: 結果項目ラベル (lblLabel2) + 結果データ表示枠 (txtEditText) -->
    <rect x="14" y="278" width="524" height="26" class="lbl-3d" />
    <text x="24" y="295" class="ui" font-size="11.5" font-weight="700" fill="#1E293B">DC電圧測定結果 (RES_VOLT)</text>

    <rect x="14" y="308" width="524" height="130" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="24" y="332" class="mono" font-size="12.5" font-weight="700" fill="#047857">+5.00124000E+00</text>
    <text x="24" y="358" class="ui" font-size="11" fill="#64748B">（※Excel シートへシーケンス配置する前に、ここでパラメータ値を調整して</text>
    <text x="24" y="376" class="ui" font-size="11" fill="#64748B">　　「実行 ▶」を押すことで、計測器の単発応答結果を即座に検証できます）</text>
  </g>

  <!-- 右側解説ボックス -->
  <rect x="598" y="28" width="320" height="452" class="callout-box" />
  <text x="614" y="54" class="callout-title">① 上部ツールバー（全6ボタン）</text>
  <text x="614" y="74" class="callout-txt">・終了（扉）：編集値を保持して画面を非表示化</text>
  <text x="614" y="92" class="callout-txt">・新規／追加：編集パラメータの新規保存・末尾追記</text>
  <text x="614" y="110" class="callout-txt">・実行▶：選択中コマンドを単発送信テスト実行</text>
  <text x="614" y="128" class="callout-txt">・停止■：待機・ウェイト処理の強制停止</text>
  <text x="614" y="146" class="callout-txt">・鍵アイコン：Hide（非公開）コマンドの表示切替</text>

  <text x="614" y="176" class="callout-title">② コマンド選択ドロップダウン</text>
  <text x="614" y="196" class="callout-txt">・選択中デバイスの全コマンドを表示。Excel の</text>
  <text x="614" y="214" class="callout-txt">  「シーケンス配置」実行時はここで選択中の</text>
  <text x="614" y="232" class="callout-txt">  コマンドが初期コマンドとしてシートへ配置されます。</text>

  <text x="614" y="260" class="callout-title">③ パラメータ入力枠（5段スロット）</text>
  <text x="614" y="280" class="callout-txt">・CSV 定義の［表示名］と初期値・選択肢を自動生成。</text>
  <text x="614" y="298" class="callout-txt">・先頭「-」付きの省略可能型（-List 等）は中央の</text>
  <text x="614" y="316" class="callout-txt">  チェックボックスで送信有無を切り替えられます。</text>

  <text x="614" y="346" class="callout-title">④ パラメータスクロールバー</text>
  <text x="614" y="366" class="callout-txt">・引数が6個以上のコマンドで右端に自動表示され、</text>
  <text x="614" y="384" class="callout-txt">  スクロール中も入力中の値はメモリに自動保持。</text>

  <text x="614" y="414" class="callout-title">⑤ 単発テスト測定結果プレビュー枠</text>
  <text x="614" y="434" class="callout-txt">・結果格納先キーの表示名と取得測定値を表示します。</text>
  <text x="614" y="452" class="callout-txt">※誤操作防止のため右上「×」ボタンは非表示です。</text>

  <!-- 番号バッジ -->
  <g>
    <circle cx="28" cy="64" r="11" class="badge-circle" />
    <text x="28" y="64" class="badge-num">1</text>

    <circle cx="280" cy="56" r="11" class="badge-circle" />
    <text x="280" y="56" class="badge-num">2</text>

    <circle cx="28" cy="144" r="11" class="badge-circle" />
    <text x="28" y="144" class="badge-num">3</text>

    <circle cx="556" cy="144" r="11" class="badge-circle" />
    <text x="556" y="144" class="badge-num">4</text>

    <circle cx="28" cy="318" r="11" class="badge-circle" />
    <text x="28" y="318" class="badge-num">5</text>
  </g>
</svg>
