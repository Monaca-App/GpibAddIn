<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310">
  <defs>
    <filter id="winShadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="excelHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#185C37" />
      <stop offset="100%" stop-color="#217346" />
    </linearGradient>
    <style>
      .ui { font-family: 'Yu Gothic UI', 'Meiryo UI', 'Segoe UI', sans-serif; }
      .mono { font-family: 'Consolas', 'BIZ UDGothic', 'MS Gothic', monospace; }
      .badge-circle { fill: #E8590C; stroke: #FFFFFF; stroke-width: 2; }
      .badge-num { font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .callout-box { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 1.3; rx: 6; }
      .rib-btn { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 5; }
      .rib-btn-hi { fill: #EFF6FF; stroke: #60A5FA; stroke-width: 1.4; rx: 5; }
      .rib-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
      .grp-lbl { font-family: 'Yu Gothic UI', 'Meiryo UI', sans-serif; font-size: 11px; font-weight: 700; fill: #64748B; text-anchor: middle; }
    </style>
  </defs>

  <!-- 背景キャンバス -->
  <rect x="0" y="0" width="960" height="310" fill="#F8FAFC" rx="10" />

  <!-- Excel ウィンドウ上部フレーム -->
  <g filter="url(#winShadow)">
    <rect x="22" y="18" width="916" height="198" rx="7" fill="#F3F4F6" stroke="#94A3B8" stroke-width="1.4" />
    <path d="M 22 25 Q 22 18 29 18 L 931 18 Q 938 18 938 25 L 938 48 L 22 48 Z" fill="url(#excelHeader)" />
  </g>

  <!-- Excel タイトルバー -->
  <rect x="34" y="25" width="16" height="16" rx="3" fill="#FFFFFF" opacity="0.92" />
  <text x="42" y="37" class="ui" font-size="11" font-weight="700" fill="#185C37" text-anchor="middle">X</text>
  <text x="60" y="37" class="ui" font-size="12.5" font-weight="700" fill="#FFFFFF">GPIB自動計測シーケンス.xlsx - Excel</text>

  <!-- リボンタブ行 -->
  <rect x="23" y="48" width="914" height="28" fill="#217346" />
  <text x="46" y="66" class="ui" font-size="12" fill="#E2E8F0">ファイル</text>
  <text x="108" y="66" class="ui" font-size="12" fill="#E2E8F0">ホーム</text>
  <text x="164" y="66" class="ui" font-size="12" fill="#E2E8F0">挿入</text>
  <text x="212" y="66" class="ui" font-size="12" fill="#E2E8F0">データ</text>
  <text x="266" y="66" class="ui" font-size="12" fill="#E2E8F0">表示</text>
  <!-- アクティブタブ: アドイン -->
  <path d="M 312 76 L 312 52 Q 312 48 316 48 L 384 48 Q 388 48 388 52 L 388 76 Z" fill="#F8FAFC" />
  <text x="350" y="66" class="ui" font-size="12" font-weight="700" fill="#185C37" text-anchor="middle">アドイン</text>
  <line x1="320" y1="74" x2="380" y2="74" stroke="#185C37" stroke-width="2.5" />

  <!-- リボン本体領域 -->
  <rect x="23" y="76" width="914" height="104" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />

  <!-- ② 共通グループ: ツール (tool) -->
  <g transform="translate(36, 82)">
    <!-- 1. マニュアル配置 -->
    <rect x="0" y="0" width="90" height="72" class="rib-btn" />
    <rect x="33" y="10" width="24" height="28" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6" />
    <line x1="38" y1="17" x2="52" y2="17" stroke="#2563EB" stroke-width="1.5" />
    <line x1="38" y1="23" x2="52" y2="23" stroke="#2563EB" stroke-width="1.5" />
    <line x1="38" y1="29" x2="48" y2="29" stroke="#2563EB" stroke-width="1.5" />
    <text x="45" y="57" class="rib-lbl">マニュアル配置</text>

    <!-- 2. スタイル保存 -->
    <rect x="98" y="0" width="84" height="72" class="rib-btn" />
    <rect x="128" y="10" width="24" height="26" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6" />
    <rect x="133" y="10" width="14" height="9" fill="#FDE68A" stroke="#D97706" stroke-width="1.2" />
    <rect x="132" y="24" width="16" height="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" />
    <text x="140" y="57" class="rib-lbl">スタイル保存</text>

    <!-- 3. Startボタン配置 -->
    <rect x="190" y="0" width="98" height="72" class="rib-btn" />
    <circle cx="239" cy="23" r="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" />
    <polygon points="235,16 247,23 235,30" fill="#16A34A" />
    <text x="239" y="57" class="rib-lbl">Startボタン配置</text>

    <!-- 4. シーケンス削除 -->
    <rect x="296" y="0" width="90" height="72" class="rib-btn" />
    <circle cx="341" cy="23" r="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6" />
    <path d="M 335 17 L 347 29 M 347 17 L 335 29" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" />
    <text x="341" y="57" class="rib-lbl">シーケンス削除</text>

    <text x="193" y="90" class="grp-lbl">ツール</text>
  </g>

  <line x1="436" y1="84" x2="436" y2="174" stroke="#CBD5E1" stroke-width="1.4" />

  <!-- ③ GPIB専用グループ: GPIB制御 (GPIB) -->
  <g transform="translate(450, 82)">
    <!-- 5. ツール起動 -->
    <rect x="0" y="0" width="88" height="72" class="rib-btn-hi" />
    <rect x="28" y="10" width="32" height="24" rx="3" fill="#0F172A" stroke="#2563EB" stroke-width="1.6" />
    <text x="44" y="25" class="mono" font-size="9.5" font-weight="700" fill="#4ADE80" text-anchor="middle">GPIB</text>
    <line x1="36" y1="38" x2="52" y2="38" stroke="#475569" stroke-width="2" />
    <text x="44" y="57" class="rib-lbl" fill="#1D4ED8">ツール起動</text>

    <!-- 6. シーケンス配置 -->
    <rect x="96" y="0" width="92" height="72" class="rib-btn-hi" />
    <rect x="126" y="10" width="32" height="25" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6" />
    <rect x="126" y="10" width="32" height="8" fill="#DBEAFE" />
    <line x1="126" y1="26" x2="158" y2="26" stroke="#93C5FD" stroke-width="1.2" />
    <circle cx="155" cy="32" r="7" fill="#16A34A" />
    <path d="M 155 28 L 155 36 M 151 32 L 159 32" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    <text x="142" y="57" class="rib-lbl" fill="#1D4ED8">シーケンス配置</text>

    <text x="94" y="90" class="grp-lbl">GPIB制御</text>
  </g>

  <line x1="654" y1="84" x2="654" y2="174" stroke="#CBD5E1" stroke-width="1.4" />

  <!-- 右側案内枠 -->
  <rect x="668" y="86" width="254" height="84" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="4 3" stroke-width="1.2" />
  <text x="795" y="110" class="ui" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">🔒 シングルインスタンス保護 ＆ 共存調停</text>
  <text x="795" y="130" class="ui" font-size="10.5" fill="#475569" text-anchor="middle">・物理 GPIB バス競合防止のため単一画面で動作</text>
  <text x="795" y="148" class="ui" font-size="10.5" fill="#475569" text-anchor="middle">・TermAddIn 共存時は［GPIB制御］［Term制御］が並列</text>

  <!-- 数式バー -->
  <rect x="23" y="180" width="914" height="35" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <rect x="32" y="187" width="68" height="21" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="66" y="202" class="mono" font-size="11.5" fill="#334155" text-anchor="middle">A5</text>
  <text x="116" y="202" class="mono" font-size="12" fill="#64748B">fx</text>
  <rect x="138" y="187" width="786" height="21" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
  <text x="148" y="202" class="ui" font-size="11" fill="#64748B">選択セルを起点に GPIB 計測シーケンス行（2行構成）をダイレクト配置（VBAコード不要・標準 .xlsx 保存）</text>

  <!-- 下部解説ボックス -->
  <rect x="22" y="228" width="916" height="68" class="callout-box" />
  <text x="40" y="250" class="ui" font-size="11.5" font-weight="700" fill="#92400E">① 「アドイン」タブ ➔ ② 共通「ツール」グループ（4ボタン） ＋ ③ 「GPIB制御」グループ（2ボタン）</text>
  <text x="40" y="270" class="ui" font-size="11" fill="#451A03">・「ツール起動」で Monaca GPIB メイン画面を起動（起動済みの場合は最前面へ表示）し、「シーケンス配置」で選択セルの位置へ</text>
  <text x="40" y="287" class="ui" font-size="11" fill="#451A03">  コマンド編集画面で選択中の計測コマンド（実行ボタン・Wait・Command・Result・公開パラメータ列）を即座に自動生成します。</text>

  <!-- 番号バッジ -->
  <g>
    <circle cx="308" cy="50" r="11" class="badge-circle" />
    <text x="308" y="50" class="badge-num">1</text>

    <circle cx="38" cy="82" r="11" class="badge-circle" />
    <text x="38" y="82" class="badge-num">2</text>

    <circle cx="450" cy="82" r="11" class="badge-circle" />
    <text x="450" y="82" class="badge-num">3</text>
  </g>
</svg>
